<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="VELOCITY">
<link rel="manifest" id="manifestLink">
<title>VELOCITY — Speedometer</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #00bfff;
    --primary-glow: rgba(0,191,255,0.4);
    --primary-dim: rgba(0,191,255,0.15);
    --bg: #000000;
    --surface: #0a0a0a;
    --surface2: #111111;
    --text: #e0e0e0;
    --text-dim: #555;
    --danger: #ff3b3b;
    --zone-color: #00bfff;
    --transition: 0.3s ease;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--text); font-family:'Rajdhani',sans-serif; }

  /* ── BACKGROUND GRID ── */
  body::before {
    content:'';
    position:fixed; inset:0;
    background-image:
      linear-gradient(var(--primary-dim) 1px, transparent 1px),
      linear-gradient(90deg, var(--primary-dim) 1px, transparent 1px);
    background-size: 60px 60px;
    opacity:0.18;
    pointer-events:none;
    z-index:0;
    transition: opacity 0.6s ease;
  }

  /* ── SPEED ZONE BG GLOW ── */
  #zoneBg {
    position:fixed; inset:0; pointer-events:none; z-index:0;
    transition: background 1.2s ease, opacity 1s ease;
    opacity:0;
  }

  /* ── BOOT SCREEN ── */
  #boot {
    position:fixed; inset:0; background:#000; z-index:999;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:20px;
  }
  #boot.hidden { opacity:0; pointer-events:none; transition: opacity 0.6s ease; }
  .boot-logo {
    font-family:'Orbitron',sans-serif; font-weight:900;
    font-size: clamp(2rem, 10vw, 4.5rem);
    letter-spacing:0.4em; color:#00bfff;
    text-shadow: 0 0 40px rgba(0,191,255,0.8), 0 0 80px rgba(0,191,255,0.3);
    opacity:0; transform:scale(0.8);
    animation: bootLogoIn 0.7s cubic-bezier(.22,.68,0,1.2) 0.2s forwards;
  }
  .boot-tagline {
    font-family:'Rajdhani',sans-serif; font-weight:300;
    font-size: clamp(0.7rem, 2.5vw, 1rem);
    letter-spacing:0.5em; color:#444; text-transform:uppercase;
    opacity:0; animation: bootFade 0.5s ease 0.8s forwards;
  }
  #bootCanvas {
    position:absolute; inset:0; pointer-events:none;
  }
  .boot-bar-wrap {
    width: min(300px, 70vw); height:2px; background:#111; border-radius:2px; overflow:hidden;
    opacity:0; animation: bootFade 0.4s ease 1s forwards;
  }
  .boot-bar {
    height:100%; background:#00bfff;
    box-shadow:0 0 12px rgba(0,191,255,0.8);
    animation: bootBarFill 1.4s cubic-bezier(.4,0,.2,1) 1.1s forwards;
    width:0;
  }
  @keyframes bootLogoIn { to { opacity:1; transform:scale(1); } }
  @keyframes bootFade { to { opacity:1; } }
  @keyframes bootBarFill { to { width:100%; } }

  /* ── MAIN APP ── */
  #app { position:relative; width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:space-between; z-index:1; padding: 12px 16px 16px; opacity:0; transition:opacity 0.6s ease; }
  #app.visible { opacity:1; }

  /* ── HEADER ── */
  header { width:100%; display:flex; align-items:center; justify-content:space-between; padding: 0 4px; }
  .logo {
    font-family:'Orbitron',sans-serif; font-weight:900; font-size:1.1rem;
    letter-spacing:0.3em; color:var(--primary);
    text-shadow: 0 0 20px var(--primary-glow);
  }
  .header-right { display:flex; gap:8px; align-items:center; }
  .icon-btn {
    background:var(--surface2); border: 1px solid var(--primary-dim);
    color:var(--primary); border-radius:8px; padding:8px 10px;
    cursor:pointer; font-size:1rem; transition:var(--transition);
    display:flex; align-items:center; gap:5px;
  }
  .icon-btn:hover { background:var(--primary-dim); box-shadow:0 0 12px var(--primary-glow); }
  .icon-btn span { font-family:'Rajdhani',sans-serif; font-size:0.75rem; font-weight:600; letter-spacing:0.05em; }
  .wake-active { border-color: #39ff14 !important; color: #39ff14 !important; }

  /* ── GAUGE WRAPPER ── */
  .gauge-section { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; width:100%; gap:0; }
  #gaugeCanvas { display:block; }

  /* ── DIGITAL READOUT ── */
  .digital-block { text-align:center; margin-top:-8px; }
  .speed-digits {
    font-family:'Orbitron',sans-serif; font-weight:900;
    font-size: clamp(2.8rem, 10vw, 5rem);
    color:var(--primary);
    text-shadow: 0 0 30px var(--primary-glow), 0 0 60px var(--primary-dim);
    line-height:1; transition: color 0.5s ease, text-shadow 0.5s ease;
  }
  .speed-unit {
    font-family:'Rajdhani',sans-serif; font-weight:600;
    font-size: clamp(0.75rem, 2.5vw, 1rem);
    color:var(--text-dim); letter-spacing:0.3em; margin-top:2px;
  }
  /* Zone label under unit */
  .zone-label {
    font-family:'Rajdhani',sans-serif; font-weight:600; font-size:0.7rem;
    letter-spacing:0.25em; text-transform:uppercase; margin-top:4px;
    transition: color 0.5s ease, opacity 0.5s ease;
    opacity:0; color: var(--zone-color);
  }
  .zone-label.visible { opacity:1; }

  /* ── LIVE INFO BAR ── */
  .live-bar {
    display:flex; gap:10px; align-items:center; justify-content:center;
    flex-wrap:wrap; margin-top:8px; opacity:0; transition:opacity 0.4s ease;
    pointer-events:none; width:100%;
  }
  .live-bar.visible { opacity:1; }
  .live-item {
    display:flex; flex-direction:column; align-items:center;
    background:var(--primary-dim); border:1px solid var(--primary-glow);
    border-radius:10px; padding:5px 12px; min-width:65px;
  }
  .live-label { font-size:0.6rem; letter-spacing:0.15em; color:var(--text-dim); text-transform:uppercase; }
  .live-value { font-family:'Orbitron',sans-serif; font-size:0.8rem; color:var(--primary); font-weight:700; }

  /* ── CLOCK ── */
  .clock-bar {
    text-align:center; font-family:'Orbitron',sans-serif;
    font-size:clamp(0.7rem, 2vw, 0.9rem); color:var(--text-dim);
    letter-spacing:0.2em; margin-top:6px;
  }

  /* ── MAP ── */
  #mapWrap {
    width:100%; max-width:420px;
    border-radius:14px; overflow:hidden;
    border:1px solid var(--primary-dim);
    background:#050505;
    opacity:0; max-height:0; transition: opacity 0.5s ease, max-height 0.5s ease, margin 0.5s ease;
    margin-top:0;
    position:relative;
  }
  #mapWrap.visible { opacity:1; max-height:140px; margin-top:10px; }
  #mapCanvas { display:block; width:100%; }
  .map-label {
    position:absolute; top:6px; left:10px;
    font-family:'Orbitron',sans-serif; font-size:0.55rem; letter-spacing:0.2em;
    color:var(--primary); opacity:0.7;
  }
  .map-dot {
    position:absolute; width:10px; height:10px; border-radius:50%;
    background:var(--primary); box-shadow:0 0 10px var(--primary-glow);
    transform:translate(-50%,-50%);
    transition: left 0.5s ease, top 0.5s ease;
    pointer-events:none;
  }

  /* ── BOTTOM CONTROLS ── */
  .controls { width:100%; display:flex; flex-direction:column; align-items:center; gap:8px; }
  .record-btn {
    background: transparent; border: 2px solid var(--primary); color: var(--primary);
    border-radius: 50px; padding: 13px 44px;
    font-family:'Orbitron',sans-serif; font-weight:700; font-size:0.85rem;
    letter-spacing:0.2em; cursor:pointer; transition: all 0.3s ease;
    box-shadow: 0 0 20px var(--primary-dim);
    position:relative; overflow:hidden;
  }
  .record-btn::before { content:''; position:absolute; inset:0; background:var(--primary); opacity:0; transition: opacity 0.3s ease; }
  .record-btn:hover::before { opacity:0.1; }
  .record-btn.recording {
    border-color: var(--danger); color: var(--danger);
    box-shadow: 0 0 30px rgba(255,59,59,0.4);
    animation: pulse-rec 1.5s ease-in-out infinite;
  }
  .rec-dot { display:none; width:8px; height:8px; border-radius:50%; background:var(--danger); margin-right:8px; animation: blink 1s ease-in-out infinite; }
  .record-btn.recording .rec-dot { display:inline-block; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
  @keyframes pulse-rec { 0%,100%{box-shadow:0 0 20px rgba(255,59,59,0.3)} 50%{box-shadow:0 0 40px rgba(255,59,59,0.7)} }

  /* ── SHEETS / OVERLAYS ── */
  .overlay {
    position:fixed; inset:0; background:rgba(0,0,0,0.85);
    backdrop-filter:blur(8px); z-index:100;
    display:flex; align-items:flex-end; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity 0.3s ease;
  }
  .overlay.open { opacity:1; pointer-events:all; }
  .sheet {
    width:100%; max-width:520px; background:var(--surface);
    border-radius:20px 20px 0 0; border-top: 1px solid var(--primary-dim);
    padding:24px 24px 36px;
    transform:translateY(100%); transition:transform 0.4s cubic-bezier(.22,.68,0,1.2);
    max-height:90vh; overflow-y:auto;
  }
  .overlay.open .sheet { transform:translateY(0); }
  .sheet-handle { width:40px; height:4px; background:var(--text-dim); border-radius:2px; margin:0 auto 20px; }
  .sheet-title { font-family:'Orbitron',sans-serif; font-size:1rem; font-weight:700; letter-spacing:0.2em; color:var(--primary); margin-bottom:24px; }
  .setting-row { margin-bottom:22px; }
  .setting-label { font-size:0.75rem; letter-spacing:0.2em; text-transform:uppercase; color:var(--text-dim); margin-bottom:10px; }

  .toggle-group { display:flex; background:var(--surface2); border-radius:10px; overflow:hidden; border:1px solid #222; }
  .toggle-option {
    flex:1; padding:10px; text-align:center; cursor:pointer;
    font-family:'Rajdhani',sans-serif; font-weight:600; font-size:0.9rem;
    letter-spacing:0.1em; transition:all 0.25s ease; color:var(--text-dim);
  }
  .toggle-option.active { background:var(--primary); color:#000; font-weight:700; }

  .swatch-row { display:flex; gap:12px; flex-wrap:wrap; }
  .swatch {
    width:40px; height:40px; border-radius:50%; cursor:pointer;
    border:2px solid transparent; transition:all 0.25s ease; position:relative;
  }
  .swatch.active { border-color:#fff; transform:scale(1.15); box-shadow:0 0 16px currentColor; }
  .swatch::after {
    content:'✓'; position:absolute; inset:0; display:flex; align-items:center;
    justify-content:center; font-size:0.9rem; color:#000; opacity:0; font-weight:900;
    transition:opacity 0.2s;
  }
  .swatch.active::after { opacity:1; }

  .danger-btn {
    background:transparent; border:1px solid rgba(255,59,59,0.5);
    color:rgba(255,59,59,0.8); border-radius:8px; padding:10px 20px;
    cursor:pointer; font-family:'Rajdhani',sans-serif; font-weight:600;
    font-size:0.85rem; letter-spacing:0.1em; transition:all 0.25s ease; width:100%;
  }
  .danger-btn:hover { background:rgba(255,59,59,0.1); border-color:var(--danger); color:var(--danger); }

  /* ── TRIP HISTORY ── */
  .trip-overlay {
    position:fixed; inset:0; background:rgba(0,0,0,0.9);
    backdrop-filter:blur(10px); z-index:100;
    display:flex; align-items:flex-end; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity 0.3s ease;
  }
  .trip-overlay.open { opacity:1; pointer-events:all; }
  .trip-sheet {
    width:100%; max-width:600px; background:var(--surface);
    border-radius:20px 20px 0 0; border-top:1px solid var(--primary-dim);
    padding:24px 20px 36px;
    transform:translateY(100%); transition:transform 0.4s cubic-bezier(.22,.68,0,1.2);
    height:85vh; display:flex; flex-direction:column;
  }
  .trip-overlay.open .trip-sheet { transform:translateY(0); }
  .trip-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; flex-shrink:0; }
  .trip-title { font-family:'Orbitron',sans-serif; font-size:1rem; font-weight:700; letter-spacing:0.2em; color:var(--primary); }
  .close-btn {
    background:var(--surface2); border:1px solid #222; color:var(--text-dim);
    border-radius:8px; padding:6px 12px; cursor:pointer; font-size:0.8rem;
    transition:var(--transition);
  }
  .close-btn:hover { color:var(--text); border-color:var(--primary); }
  .trip-list { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:12px; }
  .trip-empty { text-align:center; color:var(--text-dim); font-size:0.9rem; letter-spacing:0.1em; margin-top:60px; line-height:2; }
  .trip-card {
    background:var(--surface2); border:1px solid var(--primary-dim);
    border-radius:14px; padding:16px; border-left:3px solid var(--primary);
  }
  .trip-card-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px; gap:8px; }
  .trip-card-name { font-family:'Orbitron',sans-serif; font-size:0.8rem; color:var(--primary); font-weight:700; }
  .trip-date { font-size:0.7rem; color:var(--text-dim); letter-spacing:0.05em; }
  .trip-duration { font-family:'Orbitron',sans-serif; font-size:0.75rem; color:var(--text-dim); white-space:nowrap; }
  .trip-stats { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
  .trip-stat { text-align:center; }
  .trip-stat-val { font-family:'Orbitron',sans-serif; font-size:1rem; color:var(--text); font-weight:700; }
  .trip-stat-label { font-size:0.6rem; letter-spacing:0.12em; color:var(--text-dim); text-transform:uppercase; margin-top:2px; }
  .trip-stat.highlight .trip-stat-val { color:var(--primary); text-shadow:0 0 10px var(--primary-glow); }
  .trip-dist { margin-top:10px; padding-top:10px; border-top:1px solid #1a1a1a; display:flex; justify-content:space-between; align-items:center; }
  .trip-dist-label { font-size:0.65rem; letter-spacing:0.15em; color:var(--text-dim); text-transform:uppercase; }
  .trip-dist-val { font-family:'Orbitron',sans-serif; font-size:0.9rem; color:var(--primary); }

  /* Trip Map Thumbnail */
  .trip-map-thumb { margin-top:10px; border-radius:8px; overflow:hidden; background:#050505; border:1px solid #1a1a1a; }
  .trip-map-thumb canvas { display:block; width:100%; }

  /* ── TRIP NAME MODAL ── */
  #nameModal {
    position:fixed; inset:0; background:rgba(0,0,0,0.92);
    backdrop-filter:blur(12px); z-index:200;
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity 0.3s ease;
  }
  #nameModal.open { opacity:1; pointer-events:all; }
  .name-box {
    background:var(--surface); border:1px solid var(--primary-dim);
    border-radius:20px; padding:32px 28px; width:min(90vw, 380px);
    display:flex; flex-direction:column; gap:16px;
    transform:scale(0.9); transition:transform 0.3s cubic-bezier(.22,.68,0,1.2);
  }
  #nameModal.open .name-box { transform:scale(1); }
  .name-box-title { font-family:'Orbitron',sans-serif; font-size:0.9rem; font-weight:700; letter-spacing:0.2em; color:var(--primary); }
  .name-box p { font-size:0.85rem; color:var(--text-dim); line-height:1.5; }
  .name-input {
    background:var(--surface2); border:1px solid var(--primary-dim);
    border-radius:10px; padding:12px 16px; color:var(--text);
    font-family:'Rajdhani',sans-serif; font-size:1rem; font-weight:600;
    outline:none; letter-spacing:0.05em; width:100%;
    transition: border-color 0.25s ease;
  }
  .name-input:focus { border-color:var(--primary); }
  .name-input::placeholder { color:var(--text-dim); }
  .name-btns { display:flex; gap:10px; }
  .name-save {
    flex:1; background:var(--primary); color:#000;
    border:none; border-radius:10px; padding:12px;
    font-family:'Orbitron',sans-serif; font-weight:700; font-size:0.8rem;
    letter-spacing:0.15em; cursor:pointer; transition:opacity 0.2s ease;
  }
  .name-save:hover { opacity:0.85; }
  .name-skip {
    background:var(--surface2); color:var(--text-dim);
    border:1px solid #222; border-radius:10px; padding:12px 16px;
    font-family:'Rajdhani',sans-serif; font-weight:600; font-size:0.85rem;
    cursor:pointer; transition:var(--transition);
  }
  .name-skip:hover { color:var(--text); border-color:#444; }

  /* ── PWA INSTALL BANNER ── */
  #installBanner {
    position:fixed; bottom:80px; left:50%; transform:translateX(-50%) translateY(100px);
    background:var(--surface); border:1px solid var(--primary-dim);
    border-radius:14px; padding:12px 20px;
    display:flex; align-items:center; gap:14px;
    box-shadow:0 0 30px rgba(0,0,0,0.8);
    transition: transform 0.4s cubic-bezier(.22,.68,0,1.2), opacity 0.4s ease;
    opacity:0; z-index:50; white-space:nowrap;
  }
  #installBanner.visible { transform:translateX(-50%) translateY(0); opacity:1; }
  .install-text { font-size:0.8rem; color:var(--text-dim); }
  .install-text strong { color:var(--text); font-weight:600; }
  .install-btn {
    background:var(--primary); color:#000;
    border:none; border-radius:8px; padding:7px 14px;
    font-family:'Orbitron',sans-serif; font-weight:700; font-size:0.7rem;
    letter-spacing:0.1em; cursor:pointer;
  }
  .install-dismiss { background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:1.1rem; padding:2px 4px; }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width:4px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:var(--primary-dim); border-radius:2px; }
</style>
</head>
<body>

<!-- ── BOOT SCREEN ── -->
<div id="boot">
  <canvas id="bootCanvas"></canvas>
  <div class="boot-logo">VELOCITY</div>
  <div class="boot-tagline">Real-Time Speed Tracking</div>
  <div class="boot-bar-wrap"><div class="boot-bar"></div></div>
</div>

<!-- ── MAIN APP ── -->
<div id="app">
  <!-- Zone background glow -->
  <div id="zoneBg"></div>

  <header>
    <div class="logo">VELOCITY</div>
    <div class="header-right">
      <button class="icon-btn" id="wakeBtn" title="Keep screen awake">☀️ <span id="wakeLabel">WAKE</span></button>
      <button class="icon-btn" id="tripsBtn">📋 <span>TRIPS</span></button>
      <button class="icon-btn" id="settingsBtn">⚙️</button>
    </div>
  </header>

  <div class="gauge-section">
    <canvas id="gaugeCanvas"></canvas>
    <div class="digital-block">
      <div class="speed-digits" id="speedDigits">0</div>
      <div class="speed-unit" id="speedUnit">KM/H</div>
      <div class="zone-label" id="zoneLabel">IDLE</div>
    </div>

    <div class="live-bar" id="liveBar">
      <div class="live-item">
        <div class="live-label">TIMER</div>
        <div class="live-value" id="liveTimer">00:00</div>
      </div>
      <div class="live-item">
        <div class="live-label">DIST</div>
        <div class="live-value" id="liveDist">0.00</div>
      </div>
      <div class="live-item">
        <div class="live-label">MAX</div>
        <div class="live-value" id="liveMax">0</div>
      </div>
    </div>

    <!-- Live Map Trace -->
    <div id="mapWrap">
      <div class="map-label">LIVE ROUTE</div>
      <canvas id="mapCanvas" height="120"></canvas>
      <div class="map-dot" id="mapDot"></div>
    </div>

    <div class="clock-bar" id="clockBar">--:--:--</div>
  </div>

  <div class="controls">
    <button class="record-btn" id="recordBtn">
      <span class="rec-dot"></span>
      <span id="recordLabel">START TRIP</span>
    </button>
  </div>
</div>

<!-- ── SETTINGS SHEET ── -->
<div class="overlay" id="settingsOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">SETTINGS</div>
    <div class="setting-row">
      <div class="setting-label">Speed Unit</div>
      <div class="toggle-group">
        <div class="toggle-option active" data-unit="kmh">KM/H</div>
        <div class="toggle-option" data-unit="mph">MPH</div>
      </div>
    </div>
    <div class="setting-row">
      <div class="setting-label">Primary Color</div>
      <div class="swatch-row" id="swatches">
        <div class="swatch active" data-color="#00bfff" data-glow="rgba(0,191,255,0.4)" data-dim="rgba(0,191,255,0.15)" style="background:#00bfff;"></div>
        <div class="swatch" data-color="#39ff14" data-glow="rgba(57,255,20,0.4)" data-dim="rgba(57,255,20,0.15)" style="background:#39ff14;"></div>
        <div class="swatch" data-color="#ff3b3b" data-glow="rgba(255,59,59,0.4)" data-dim="rgba(255,59,59,0.15)" style="background:#ff3b3b;"></div>
        <div class="swatch" data-color="#bf5fff" data-glow="rgba(191,95,255,0.4)" data-dim="rgba(191,95,255,0.15)" style="background:#bf5fff;"></div>
        <div class="swatch" data-color="#ff8c00" data-glow="rgba(255,140,0,0.4)" data-dim="rgba(255,140,0,0.15)" style="background:#ff8c00;"></div>

<script>
// ══════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════
const state = {
  speed: 0,
  unit: 'kmh',
  color: { hex:'#00bfff', glow:'rgba(0,191,255,0.4)', dim:'rgba(0,191,255,0.15)' },
  recording: false,
  tripStart: null,
  tripTimer: null,
  tripDistance: 0,
  tripMaxSpeed: 0,
  tripMinSpeed: Infinity,
  tripSpeeds: [],
  tripDuration: 0,
  lastPos: null,
  lastPosTime: null,
  trips: JSON.parse(localStorage.getItem('velocity_trips') || '[]'),
  watchId: null,
  simulMode: false,
  simulSpeed: 0,
  simulDir: 1,
  simulLat: 51.505,
  simulLng: -0.09,
  simulHeading: 45,
  routePoints: [],       // [{lat,lng}] for current trip
  pendingTripData: null, // saved before naming
  wakeLock: null,
  wakeActive: false,
  currentZone: 'idle',
  deferredPrompt: null,
};

// ══════════════════════════════════════════════
// BOOT SCREEN
// ══════════════════════════════════════════════
(function bootAnimation() {
  const bootCanvas = document.getElementById('bootCanvas');
  const bCtx = bootCanvas.getContext('2d');
  bootCanvas.width = window.innerWidth;
  bootCanvas.height = window.innerHeight;

  // Sweeping needle animation on boot canvas
  let bootAngle = Math.PI;
  let bootDir = 1;
  let bootFrame;

  function drawBootNeedle() {
    const W = bootCanvas.width, H = bootCanvas.height;
    const cx = W / 2, cy = H * 0.55;
    const R = Math.min(W, H) * 0.32;
    bCtx.clearRect(0, 0, W, H);

    // Arc
    bCtx.beginPath();
    bCtx.arc(cx, cy, R, Math.PI, 2 * Math.PI);
    bCtx.strokeStyle = 'rgba(0,191,255,0.08)';
    bCtx.lineWidth = 3;
    bCtx.stroke();

    // Needle
    const nx = cx + Math.cos(bootAngle) * R * 0.75;
    const ny = cy + Math.sin(bootAngle) * R * 0.75;
    bCtx.save();
    bCtx.shadowBlur = 30;
    bCtx.shadowColor = '#00bfff';
    bCtx.beginPath();
    bCtx.moveTo(cx, cy);
    bCtx.lineTo(nx, ny);
    bCtx.strokeStyle = 'rgba(0,191,255,0.6)';
    bCtx.lineWidth = 2;
    bCtx.stroke();
    bCtx.restore();

    bootAngle += 0.04 * bootDir;
    if (bootAngle >= 1.97 * Math.PI) bootDir = -1;
    if (bootAngle <= 1.01 * Math.PI) bootDir = 1;
    bootFrame = requestAnimationFrame(drawBootNeedle);
  }
  drawBootNeedle();

  // After 2.8s, hide boot and show app
  setTimeout(() => {
    cancelAnimationFrame(bootFrame);
    const boot = document.getElementById('boot');
    boot.classList.add('hidden');
    boot.addEventListener('transitionend', () => boot.style.display = 'none', { once: true });
    document.getElementById('app').classList.add('visible');
    initApp();
  }, 2800);
})();

// ══════════════════════════════════════════════
// SPEED ZONES
// ══════════════════════════════════════════════
const ZONES = [
  { name: 'IDLE',    min: 0,   max: 5,   color: '#00bfff', glow: 'rgba(0,191,255,0.08)',  bgGlow: 'transparent' },
  { name: 'SLOW',    min: 5,   max: 30,  color: '#00bfff', glow: 'rgba(0,191,255,0.12)',  bgGlow: 'radial-gradient(ellipse at 50% 100%, rgba(0,191,255,0.04) 0%, transparent 70%)' },
  { name: 'CRUISING',min: 30,  max: 80,  color: '#00e676', glow: 'rgba(0,230,118,0.18)',  bgGlow: 'radial-gradient(ellipse at 50% 100%, rgba(0,230,118,0.07) 0%, transparent 70%)' },
  { name: 'HIGHWAY', min: 80,  max: 130, color: '#ffaa00', glow: 'rgba(255,170,0,0.2)',   bgGlow: 'radial-gradient(ellipse at 50% 100%, rgba(255,170,0,0.08) 0%, transparent 70%)' },
  { name: 'FAST',    min: 130, max: 160, color: '#ff6600', glow: 'rgba(255,102,0,0.25)',  bgGlow: 'radial-gradient(ellipse at 50% 100%, rgba(255,102,0,0.1) 0%, transparent 70%)' },
  { name: 'DANGER',  min: 160, max: 999, color: '#ff3b3b', glow: 'rgba(255,59,59,0.3)',   bgGlow: 'radial-gradient(ellipse at 50% 100%, rgba(255,59,59,0.12) 0%, transparent 70%)' },
];

function getZone(speedKmh) {
  return ZONES.find(z => speedKmh >= z.min && speedKmh < z.max) || ZONES[0];
}

function updateZone(speedKmh) {
  const zone = getZone(speedKmh);
  if (zone.name === state.currentZone) return;
  state.currentZone = zone.name;
  const zoneLabel = document.getElementById('zoneLabel');
  zoneLabel.textContent = zone.name;
  zoneLabel.style.color = zone.color;
  zoneLabel.classList.toggle('visible', speedKmh >= 5);

  // Background glow
  const zoneBg = document.getElementById('zoneBg');
  zoneBg.style.background = zone.bgGlow;
  zoneBg.style.opacity = speedKmh >= 5 ? '1' : '0';
}

// ══════════════════════════════════════════════
// CANVAS GAUGE
// ══════════════════════════════════════════════
const canvas = document.getElementById('gaugeCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const size = Math.min(vw * 0.92, vh * 0.42, 420);
  canvas.width = size;
  canvas.height = size * 0.6;
  drawGauge(displayedSpeed);
  resizeMapCanvas();
}

function drawGauge(speed) {
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  const cx = W / 2, cy = H * 0.93;
  const R = Math.min(W * 0.46, H * 0.87);
  const startAngle = Math.PI;
  const maxSpeed = 200;
  const col = state.color.hex;
  const zone = getZone(speed * (state.unit === 'mph' ? 1.60934 : 1));
  const arcColor = zone.color;

  // Track BG
  ctx.beginPath();
  ctx.arc(cx, cy, R, startAngle, 2 * Math.PI);
  ctx.strokeStyle = '#1a1a1a';
  ctx.lineWidth = R * 0.045;
  ctx.stroke();

  // Speed arc
  const speedFrac = Math.min(speed / maxSpeed, 1);
  const speedAngle = startAngle + speedFrac * Math.PI;
  ctx.save();
  ctx.shadowBlur = 20;
  ctx.shadowColor = arcColor;
  ctx.beginPath();
  ctx.arc(cx, cy, R, startAngle, speedAngle);
  ctx.strokeStyle = arcColor;
  ctx.lineWidth = R * 0.045;
  ctx.lineCap = 'round';
  ctx.stroke();
  ctx.restore();

  // Tick marks & labels
  for (let s = 0; s <= maxSpeed; s += 10) {
    const frac = s / maxSpeed;
    const angle = Math.PI + frac * Math.PI;
    const isMajor = s % 20 === 0;
    const tickLen = isMajor ? R * 0.12 : R * 0.07;
    const sinA = Math.sin(angle), cosA = Math.cos(angle);
    ctx.beginPath();
    ctx.moveTo(cx + cosA * (R - tickLen), cy + sinA * (R - tickLen));
    ctx.lineTo(cx + cosA * (R + R * 0.005), cy + sinA * (R + R * 0.005));
    ctx.strokeStyle = isMajor ? col : '#2a2a2a';
    ctx.lineWidth = isMajor ? 2 : 1;
    if (isMajor) { ctx.save(); ctx.shadowBlur = 6; ctx.shadowColor = col; ctx.stroke(); ctx.restore(); }
    else ctx.stroke();

    if (isMajor) {
      const labelR = R - tickLen - R * 0.1;
      ctx.save();
      ctx.font = `${R * 0.085}px Orbitron, monospace`;
      ctx.fillStyle = '#666';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(s, cx + Math.cos(angle) * labelR, cy + Math.sin(angle) * labelR);
      ctx.restore();
    }
  }

  // Needle
  const needleAngle = Math.PI + speedFrac * Math.PI;
  const needleLen = R * 0.78;
  const needleBackLen = R * 0.18;
  const nx = cx + Math.cos(needleAngle) * needleLen;
  const ny = cy + Math.sin(needleAngle) * needleLen;
  const perpAngle = needleAngle + Math.PI / 2;
  const baseW = R * 0.022;
  ctx.save();
  ctx.shadowBlur = 24;
  ctx.shadowColor = arcColor;
  ctx.beginPath();
  ctx.moveTo(cx + Math.cos(perpAngle) * baseW, cy + Math.sin(perpAngle) * baseW);
  ctx.lineTo(nx, ny);
  ctx.lineTo(cx - Math.cos(perpAngle) * baseW, cy - Math.sin(perpAngle) * baseW);
  ctx.lineTo(cx - Math.cos(needleAngle) * needleBackLen, cy - Math.sin(needleAngle) * needleBackLen);
  ctx.closePath();
  ctx.fillStyle = arcColor;
  ctx.fill();
  ctx.restore();

  // Hub
  const hubR = R * 0.06;
  ctx.save();
  ctx.shadowBlur = 20;
  ctx.shadowColor = col;
  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, hubR);
  grad.addColorStop(0, '#fff');
  grad.addColorStop(0.4, col);
  grad.addColorStop(1, '#000');
  ctx.beginPath();
  ctx.arc(cx, cy, hubR, 0, 2 * Math.PI);
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.restore();
}

// ══════════════════════════════════════════════
// LIVE MAP TRACE
// ══════════════════════════════════════════════
const mapCanvas = document.getElementById('mapCanvas');
const mCtx = mapCanvas.getContext('2d');
const mapWrap = document.getElementById('mapWrap');
const mapDot = document.getElementById('mapDot');

function resizeMapCanvas() {
  mapCanvas.width = mapWrap.clientWidth || window.innerWidth;
  mapCanvas.height = 120;
  drawMap();
}

function drawMap() {
  const W = mapCanvas.width, H = mapCanvas.height;
  mCtx.clearRect(0, 0, W, H);
  if (state.routePoints.length < 2) return;

  const lats = state.routePoints.map(p => p.lat);
  const lngs = state.routePoints.map(p => p.lng);
  const minLat = Math.min(...lats), maxLat = Math.max(...lats);
  const minLng = Math.min(...lngs), maxLng = Math.max(...lngs);
  const pad = 16;

  function toXY(lat, lng) {
    const latRange = maxLat - minLat || 0.001;
    const lngRange = maxLng - minLng || 0.001;
    const scale = Math.min((W - pad*2) / lngRange, (H - pad*2) / latRange);
    const x = pad + (lng - minLng) * scale + ((W - pad*2) - lngRange * scale) / 2;
    const y = H - pad - (lat - minLat) * scale - ((H - pad*2) - latRange * scale) / 2;
    return { x, y };
  }

  // Trail fade
  for (let i = 1; i < state.routePoints.length; i++) {
    const a = toXY(state.routePoints[i-1].lat, state.routePoints[i-1].lng);
    const b = toXY(state.routePoints[i].lat, state.routePoints[i].lng);
    const prog = i / state.routePoints.length;
    mCtx.beginPath();
    mCtx.moveTo(a.x, a.y);
    mCtx.lineTo(b.x, b.y);
    mCtx.strokeStyle = state.color.hex;
    mCtx.globalAlpha = 0.2 + prog * 0.8;
    mCtx.lineWidth = 2;
    mCtx.lineCap = 'round';
    mCtx.stroke();
    mCtx.globalAlpha = 1;
  }

  // Current position dot
  const last = state.routePoints[state.routePoints.length - 1];
  const pos = toXY(last.lat, last.lng);
  const rect = mapWrap.getBoundingClientRect();
  const dotLeft = (pos.x / W) * 100 + '%';
  const dotTop  = (pos.y / mapCanvas.height) * 100 + '%';
  mapDot.style.left = dotLeft;
  mapDot.style.top = dotTop;
}

function addRoutePoint(lat, lng) {
  state.routePoints.push({ lat, lng });
  if (state.routePoints.length > 500) state.routePoints.shift();
  drawMap();
}

// ══════════════════════════════════════════════
// CLOCK
// ══════════════════════════════════════════════
function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2,'0');
  const m = String(now.getMinutes()).padStart(2,'0');
  const s = String(now.getSeconds()).padStart(2,'0');
  document.getElementById('clockBar').textContent = `${h}:${m}:${s}`;
}
setInterval(updateClock, 1000);
updateClock();

// ══════════════════════════════════════════════
// SPEED ANIMATION
// ══════════════════════════════════════════════
let displayedSpeed = 0;
let animFrame;

function animateSpeed(target) {
  cancelAnimationFrame(animFrame);
  function step() {
    const diff = target - displayedSpeed;
    if (Math.abs(diff) < 0.3) { displayedSpeed = target; }
    else { displayedSpeed += diff * 0.12; }
    const shown = Math.round(displayedSpeed);
    document.getElementById('speedDigits').textContent = shown;
    drawGauge(displayedSpeed);
    if (Math.abs(displayedSpeed - target) > 0.2) animFrame = requestAnimationFrame(step);
    else { drawGauge(target); document.getElementById('speedDigits').textContent = Math.round(target); }
  }
  step();
}

function setSpeed(kmh) {
  const dispSpeed = state.unit === 'mph' ? kmh * 0.621371 : kmh;
  animateSpeed(dispSpeed);
  state.speed = dispSpeed;
  document.getElementById('speedUnit').textContent = state.unit === 'mph' ? 'MPH' : 'KM/H';
  updateZone(kmh);

  if (state.recording) {
    const raw = dispSpeed;
    if (raw > state.tripMaxSpeed) {
      state.tripMaxSpeed = raw;
      document.getElementById('liveMax').textContent = Math.round(raw);
    }
    if (raw > 3 && raw < state.tripMinSpeed) state.tripMinSpeed = raw;
    state.tripSpeeds.push(raw);
  }
}

// ══════════════════════════════════════════════
// GEOLOCATION
// ══════════════════════════════════════════════

// Speed smoothing buffer — averages last N readings to reduce jitter
const speedBuffer = [];
const SPEED_BUFFER_SIZE = 4;

function smoothSpeed(kmh) {
  speedBuffer.push(kmh);
  if (speedBuffer.length > SPEED_BUFFER_SIZE) speedBuffer.shift();
  return speedBuffer.reduce((a, b) => a + b, 0) / speedBuffer.length;
}

function startGPS() {
  if (!navigator.geolocation) {
    startSimulator();
    return;
  }

  let gpsConfirmed = false; // becomes true once we get a real fix

  state.watchId = navigator.geolocation.watchPosition(
    pos => {
      gpsConfirmed = true;

      // ── ACCURACY FILTER: ignore readings worse than 25m ──
      if (pos.coords.accuracy > 25) return;

      const now = Date.now();

      // ── SPEED CALCULATION ──
      let kmh = 0;

      if (pos.coords.speed != null && pos.coords.speed >= 0) {
        // Use native GPS speed (most accurate on phones)
        kmh = pos.coords.speed * 3.6;
      } else if (state.lastPos && state.lastPosTime) {
        // Fallback: derive from distance/time only if accuracy is good
        const dt = (now - state.lastPosTime) / 1000;
        if (dt > 0 && dt < 5) { // ignore stale gaps
          const d = haversine(state.lastPos, pos.coords);
          kmh = (d / dt) * 3.6;
        }
      }

      // ── CLAMP: below 2 km/h = show 0 (GPS noise when stationary) ──
      if (kmh < 2) kmh = 0;

      // ── CAP: discard physically impossible jumps (>300 km/h) ──
      if (kmh > 300) return;

      // ── SMOOTH: rolling average to prevent needle jitter ──
      const smoothed = smoothSpeed(kmh);
      setSpeed(smoothed);

      if (state.recording) {
        if (state.lastPos) {
          const d = haversine(state.lastPos, pos.coords);
          // Only count distance if movement is plausible (>1m, accuracy OK)
          if (d > 1 && d < 500) {
            state.tripDistance += d / 1000;
            updateLiveDist();
          }
        }
        addRoutePoint(pos.coords.latitude, pos.coords.longitude);
      }

      state.lastPos = pos.coords;
      state.lastPosTime = now;
    },
    err => {
      // PERMISSION_DENIED (1) → user said no, don't simulate on their phone
      // POSITION_UNAVAILABLE (2) → no GPS hardware → simulate (desktop)
      // TIMEOUT (3) → might just be slow fix, wait longer before giving up
      if (err.code === 1) {
        // Permission denied — show 0 and wait, don't simulate
        setSpeed(0);
        showGpsStatus('GPS access denied. Enable location to use speedometer.');
      } else if (err.code === 2 && !gpsConfirmed) {
        // No GPS hardware at all → desktop fallback
        startSimulator();
      } else if (err.code === 3 && !gpsConfirmed) {
        // Timeout but GPS exists — retry silently, don't simulate yet
        retryGPS();
      }
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 1000 }
  );
}

let retryCount = 0;
function retryGPS() {
  retryCount++;
  if (retryCount > 4) {
    // After 4 retries (~60s) give up and simulate — probably desktop
    startSimulator();
    return;
  }
  setTimeout(() => {
    if (!state.simulMode) startGPS();
  }, 8000);
}

function showGpsStatus(msg) {
  // Show a brief non-intrusive status under the clock
  const clock = document.getElementById('clockBar');
  const original = clock.textContent;
  clock.style.color = '#ff3b3b';
  clock.textContent = msg;
  setTimeout(() => {
    clock.style.color = '';
    updateClock();
  }, 4000);
}

function haversine(a, b) {
  const R = 6371000;
  const dLat = (b.latitude - a.latitude) * Math.PI / 180;
  const dLon = (b.longitude - a.longitude) * Math.PI / 180;
  const aa = Math.sin(dLat/2)**2 + Math.cos(a.latitude*Math.PI/180)*Math.cos(b.latitude*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(aa), Math.sqrt(1-aa));
}

// ══════════════════════════════════════════════
// SIMULATOR (desktop-only fallback — never runs on real GPS devices)
// ══════════════════════════════════════════════
let simInterval;
function startSimulator() {
  // Safety guard: if we already got a real GPS fix, do not simulate
  if (state.lastPos) return;

  state.simulMode = true;
  state.simulSpeed = 0;
  state.simulDir = 1;
  state.simulLat = 51.505 + (Math.random() - 0.5) * 0.01;
  state.simulLng = -0.09 + (Math.random() - 0.5) * 0.01;
  state.simulHeading = Math.random() * 360;
  clearInterval(simInterval);

  simInterval = setInterval(() => {
    const targetSpeed = state.simulDir > 0 ? 80 + Math.random() * 40 : 10 + Math.random() * 20;
    state.simulSpeed += (targetSpeed - state.simulSpeed) * 0.05 + (Math.random() - 0.5) * 2;
    state.simulSpeed = Math.max(0, Math.min(160, state.simulSpeed));
    if (state.simulSpeed >= 130) state.simulDir = -1;
    if (state.simulSpeed <= 5) state.simulDir = 1;
    state.simulHeading += (Math.random() - 0.5) * 6;
    const km = state.simulSpeed;
    setSpeed(km);
    if (state.recording) {
      const dt = 0.5 / 3600;
      state.tripDistance += km * dt;
      updateLiveDist();
      const headingRad = state.simulHeading * Math.PI / 180;
      const moveScale = km * 0.5 / 111000;
      state.simulLat += Math.cos(headingRad) * moveScale;
      state.simulLng += Math.sin(headingRad) * moveScale;
      addRoutePoint(state.simulLat, state.simulLng);
    }
  }, 500);
}

function updateLiveDist() {
  const dist = state.unit === 'mph' ? state.tripDistance * 0.621371 : state.tripDistance;
  document.getElementById('liveDist').textContent = dist.toFixed(2);
}

// ══════════════════════════════════════════════
// TRIP RECORDING
// ══════════════════════════════════════════════
document.getElementById('recordBtn').addEventListener('click', () => {
  if (!state.recording) startTrip();
  else stopTrip();
});

function startTrip() {
  state.recording = true;
  state.tripStart = Date.now();
  state.tripDistance = 0;
  state.tripMaxSpeed = 0;
  state.tripMinSpeed = Infinity;
  state.tripSpeeds = [];
  state.routePoints = [];
  document.getElementById('recordBtn').classList.add('recording');
  document.getElementById('recordLabel').textContent = 'STOP TRIP';
  document.getElementById('liveBar').classList.add('visible');
  document.getElementById('liveTimer').textContent = '00:00';
  document.getElementById('liveDist').textContent = '0.00';
  document.getElementById('liveMax').textContent = '0';
  mapWrap.classList.add('visible');
  setTimeout(resizeMapCanvas, 520);

  state.tripTimer = setInterval(() => {
    const elapsed = Math.floor((Date.now() - state.tripStart) / 1000);
    const m = String(Math.floor(elapsed / 60)).padStart(2,'0');
    const s = String(elapsed % 60).padStart(2,'0');
    document.getElementById('liveTimer').textContent = `${m}:${s}`;
    state.tripDuration = elapsed;
  }, 1000);
}

function stopTrip() {
  state.recording = false;
  clearInterval(state.tripTimer);
  document.getElementById('recordBtn').classList.remove('recording');
  document.getElementById('recordLabel').textContent = 'START TRIP';
  document.getElementById('liveBar').classList.remove('visible');
  mapWrap.classList.remove('visible');

  const dur = Math.floor((Date.now() - state.tripStart) / 1000);
  const avgSpeed = state.tripSpeeds.length > 0
    ? state.tripSpeeds.reduce((a,b)=>a+b,0) / state.tripSpeeds.length : 0;
  const minSpeed = state.tripMinSpeed === Infinity ? 0 : state.tripMinSpeed;
  const dist = state.unit === 'mph' ? state.tripDistance * 0.621371 : state.tripDistance;
  const u = state.unit === 'mph' ? 'mph' : 'km/h';
  const du = state.unit === 'mph' ? 'mi' : 'km';

  state.pendingTripData = {
    name: '',
    date: new Date().toLocaleString(),
    duration: dur,
    distance: dist,
    distUnit: du,
    maxSpeed: Math.round(state.tripMaxSpeed),
    minSpeed: Math.round(minSpeed),
    avgSpeed: Math.round(avgSpeed),
    speedUnit: u,
    route: [...state.routePoints],
  };

  state.lastPos = null;
  state.lastPosTime = null;

  // Show naming modal
  document.getElementById('nameInput').value = '';
  document.getElementById('nameModal').classList.add('open');
  setTimeout(() => document.getElementById('nameInput').focus(), 400);
}

// ── Trip Name Modal ──
function savePendingTrip(name) {
  state.pendingTripData.name = name || 'Unnamed Trip';
  state.trips.unshift(state.pendingTripData);
  localStorage.setItem('velocity_trips', JSON.stringify(state.trips));
  state.pendingTripData = null;
  document.getElementById('nameModal').classList.remove('open');
}

document.getElementById('nameSave').addEventListener('click', () => {
  savePendingTrip(document.getElementById('nameInput').value.trim());
});
document.getElementById('nameSkip').addEventListener('click', () => {
  savePendingTrip('');
});
document.getElementById('nameInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') savePendingTrip(document.getElementById('nameInput').value.trim());
});

function formatDur(sec) {
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  if (h > 0) return `${h}h ${m}m ${s}s`;
  return `${m}m ${s}s`;
}

function renderTripMapThumb(route, container) {
  if (!route || route.length < 2) return;
  const c = document.createElement('canvas');
  c.width = container.clientWidth || 300;
  c.height = 70;
  container.appendChild(c);
  const cx2 = c.getContext('2d');
  const W = c.width, H = c.height;
  const lats = route.map(p=>p.lat), lngs = route.map(p=>p.lng);
  const minLat = Math.min(...lats), maxLat = Math.max(...lats);
  const minLng = Math.min(...lngs), maxLng = Math.max(...lngs);
  const pad = 10;
  function toXY(lat, lng) {
    const lR = maxLat - minLat || 0.001, lgR = maxLng - minLng || 0.001;
    const scale = Math.min((W-pad*2)/lgR, (H-pad*2)/lR);
    return {
      x: pad + (lng - minLng) * scale + ((W-pad*2) - lgR*scale)/2,
      y: H - pad - (lat - minLat) * scale - ((H-pad*2) - lR*scale)/2
    };
  }
  cx2.beginPath();
  route.forEach((p, i) => {
    const {x,y} = toXY(p.lat, p.lng);
    i === 0 ? cx2.moveTo(x,y) : cx2.lineTo(x,y);
  });
  cx2.strokeStyle = state.color.hex;
  cx2.lineWidth = 2;
  cx2.globalAlpha = 0.8;
  cx2.stroke();
  // Start/end dots
  const start = toXY(route[0].lat, route[0].lng);
  const end = toXY(route[route.length-1].lat, route[route.length-1].lng);
  cx2.globalAlpha = 1;
  cx2.beginPath(); cx2.arc(start.x, start.y, 4, 0, Math.PI*2);
  cx2.fillStyle = '#00e676'; cx2.fill();
  cx2.beginPath(); cx2.arc(end.x, end.y, 4, 0, Math.PI*2);
  cx2.fillStyle = '#ff3b3b'; cx2.fill();
}

function renderTrips() {
  const list = document.getElementById('tripList');
  if (state.trips.length === 0) {
    list.innerHTML = '<div class="trip-empty">📍 No trips recorded yet.<br><br>Hit START TRIP to begin tracking.</div>';
    return;
  }
  list.innerHTML = '';
  state.trips.forEach((t, i) => {
    const card = document.createElement('div');
    card.className = 'trip-card';
    card.style.borderLeftColor = state.color.hex;
    card.innerHTML = `
      <div class="trip-card-header">
        <div>
          <div class="trip-card-name">${t.name || 'Unnamed Trip'}</div>
          <div class="trip-date">${t.date}</div>
        </div>
        <div class="trip-duration">${formatDur(t.duration)}</div>
      </div>
      <div class="trip-stats">
        <div class="trip-stat highlight">
          <div class="trip-stat-val">${t.maxSpeed}</div>
          <div class="trip-stat-label">Max ${t.speedUnit}</div>
        </div>
        <div class="trip-stat">
          <div class="trip-stat-val">${t.avgSpeed}</div>
          <div class="trip-stat-label">Avg ${t.speedUnit}</div>
        </div>
        <div class="trip-stat">
          <div class="trip-stat-val">${t.minSpeed}</div>
          <div class="trip-stat-label">Min ${t.speedUnit}</div>
        </div>
      </div>
      <div class="trip-dist">
        <div class="trip-dist-label">Total Distance</div>
        <div class="trip-dist-val">${t.distance.toFixed(2)} ${t.distUnit}</div>
      </div>
    `;
    if (t.route && t.route.length > 1) {
      const thumb = document.createElement('div');
      thumb.className = 'trip-map-thumb';
      card.appendChild(thumb);
      setTimeout(() => renderTripMapThumb(t.route, thumb), 50);
    }
    list.appendChild(card);
  });
}

// ══════════════════════════════════════════════
// WAKE LOCK
// ══════════════════════════════════════════════
const wakeBtn = document.getElementById('wakeBtn');
const wakeLabel = document.getElementById('wakeLabel');

async function requestWakeLock() {
  if (!('wakeLock' in navigator)) {
    wakeLabel.textContent = 'N/A';
    return;
  }
  try {
    state.wakeLock = await navigator.wakeLock.request('screen');
    state.wakeActive = true;
    wakeBtn.classList.add('wake-active');
    wakeLabel.textContent = 'ON';
    state.wakeLock.addEventListener('release', () => {
      state.wakeActive = false;
      wakeBtn.classList.remove('wake-active');
      wakeLabel.textContent = 'WAKE';
    });
  } catch (e) {
    wakeLabel.textContent = 'ERR';
  }
}

async function releaseWakeLock() {
  if (state.wakeLock) {
    await state.wakeLock.release();
    state.wakeLock = null;
  }
  state.wakeActive = false;
  wakeBtn.classList.remove('wake-active');
  wakeLabel.textContent = 'WAKE';
}

wakeBtn.addEventListener('click', async () => {
  if (state.wakeActive) await releaseWakeLock();
  else await requestWakeLock();
});

// Re-acquire wake lock on visibility change
document.addEventListener('visibilitychange', async () => {
  if (state.wakeActive && document.visibilityState === 'visible') {
    await requestWakeLock();
  }
});

// ══════════════════════════════════════════════
// PWA — SERVICE WORKER + MANIFEST
// ══════════════════════════════════════════════
function setupPWA() {
  // Inline manifest via blob
  const manifest = {
    name: 'VELOCITY Speedometer',
    short_name: 'VELOCITY',
    description: 'Real-time GPS speedometer',
    start_url: './',
    display: 'standalone',
    background_color: '#000000',
    theme_color: '#00bfff',
    orientation: 'portrait',
    icons: [
      { src: 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192"><rect width="192" height="192" fill="#000"/><text x="96" y="130" text-anchor="middle" font-size="100" fill="#00bfff">⚡</text></svg>`), sizes: '192x192', type: 'image/svg+xml' },
    ]
  };
  const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  document.getElementById('manifestLink').setAttribute('href', url);

  // Register inline SW
  if ('serviceWorker' in navigator) {
    const swCode = `
      const CACHE = 'velocity-v1';
      const ASSETS = ['./', './index.html'];
      self.addEventListener('install', e => {
        e.waitUntil(caches.open(CACHE).then(c => c.addAll([])));
        self.skipWaiting();
      });
      self.addEventListener('activate', e => {
        e.waitUntil(caches.keys().then(keys => Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))));
        self.clients.claim();
      });
      self.addEventListener('fetch', e => {
        e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
      });
    `;
    const swBlob = new Blob([swCode], { type: 'application/javascript' });
    const swUrl = URL.createObjectURL(swBlob);
    navigator.serviceWorker.register(swUrl).catch(() => {});
  }
}

// Install prompt
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  state.deferredPrompt = e;
  const banner = document.getElementById('installBanner');
  if (!localStorage.getItem('pwa_dismissed')) {
    setTimeout(() => banner.classList.add('visible'), 3500);
  }
});

document.getElementById('installBtn').addEventListener('click', async () => {
  if (state.deferredPrompt) {
    state.deferredPrompt.prompt();
    const { outcome } = await state.deferredPrompt.userChoice;
    state.deferredPrompt = null;
    document.getElementById('installBanner').classList.remove('visible');
  }
});

document.getElementById('installDismiss').addEventListener('click', () => {
  document.getElementById('installBanner').classList.remove('visible');
  localStorage.setItem('pwa_dismissed', '1');
});

// ══════════════════════════════════════════════
function initApp() {
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();
  setupPWA();
  startGPS();
}
